name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Run JS actions (checkout, upload/download-artifact, etc.) on Node.js 24.
# Node 20 action runtime is deprecated and removed from runners 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (arm64)
            runner: macos-15
            args: --mac --arm64
            artifact: myanso-macos-arm64
          - name: Linux x64 (AppImage/deb/rpm)
            runner: ubuntu-latest
            args: --linux AppImage deb rpm --x64
            artifact: myanso-linux-x64
          - name: Linux arm64 (AppImage/deb/rpm)
            runner: ubuntu-24.04-arm
            args: --linux AppImage deb rpm --arm64
            artifact: myanso-linux-arm64
          - name: Windows (NSIS)
            runner: windows-latest
            args: --win nsis
            artifact: myanso-windows-nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Python (node-gyp)
        if: matrix.platform.runner != 'macos-15'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linux build deps
        if: startsWith(matrix.platform.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rpm fakeroot

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Patch xterm for Myanmar rendering
        run: node patches/patch-xterm-myanmar.js

      - name: Run checks
        run: npm run check

      - name: Prepare macOS signing and notarization credentials
        if: matrix.platform.runner == 'macos-15'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          for required in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required GitHub secret: ${required/CONTENT/}" >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if [[ "$APPLE_API_KEY_CONTENT" == *"-----BEGIN PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key_path"
          else
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$key_path"
          fi
          chmod 600 "$key_path"

          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package macOS with signing and notarization
        if: matrix.platform.runner == 'macos-15'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          npx electron-builder ${{ matrix.platform.args }} \
            -c.mac.hardenedRuntime=true \
            -c.mac.notarize=true \
            -c.mac.forceCodeSigning=true \
            --publish never
        shell: bash

      - name: Package non-macOS target
        if: matrix.platform.runner != 'macos-15'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_MAINTAINER: ${{ secrets.LINUX_MAINTAINER }}
        run: npx electron-builder ${{ matrix.platform.args }} -c.linux.maintainer="$LINUX_MAINTAINER" --publish never
        shell: bash

      - name: Verify macOS signature and notarization
        if: matrix.platform.runner == 'macos-15'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find dist -type d -name 'Myanso.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Could not find Myanso.app in dist" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signing_details="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signing_details"
          grep -Fq 'Authority=Developer ID Application:' <<< "$signing_details"
          grep -Fq "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signing_details"
          spctl --assess --verbose=4 --type exec "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify expected installers
        shell: bash
        run: |
          require_ext() {
            find dist -maxdepth 1 -type f -name "*.$1" -print -quit | grep -q . || {
              echo "Missing required .$1 artifact" >&2
              exit 1
            }
          }
          case "${{ matrix.platform.name }}" in
            "macOS (arm64)") require_ext dmg ;;
            "Windows (NSIS)") require_ext exe ;;
            "Linux "*)
              require_ext AppImage
              require_ext deb
              require_ext rpm
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform.artifact }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Myanso ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
